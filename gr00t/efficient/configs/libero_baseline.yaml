benchmark: LIBERO
method: baseline
keep_ratio: 1.0
num_episodes: 1
task: debug
dry_run: false
output: results/efficient_benchmark/libero_baseline.json
efficient_inference:
  enabled: false
  method: baseline
  hook_visual_tokens: false
record_metrics:
  - success_rate
  - latency_per_action_ms
  - episode_time_s
  - gpu_memory_mb
  - peak_gpu_memory_mb
  - visual_token_count
  - action_l2_vs_baseline
